server:
  port: ${PORT:8080}

spring:
  application:
    name: expense-claim-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_claim_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Generate with: openssl rand -base64 32
    secret: ${JWT_SECRET_B64}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:90000000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  bootstrap:
    manager:
      name: ${MANAGER_NAME:System Manager}
      email: ${MANAGER_EMAIL:manager@example.com}
      password: ${MANAGER_PASSWORD:Manager@123}

  receipts:
    directory: ${RECEIPTS_DIRECTORY:./uploads/receipts}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

